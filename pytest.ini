[pytest]
pythonpath = src
testpaths = tests

# The default suite must run offline and deterministically, so tests that reach
# an external service are deselected here rather than skipped inside the test.
# Run them deliberately with: python -m pytest -m network
addopts = -m "not network"

markers =
    network: requires outbound network access to an external service (e.g. the OpenAI API).
